<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Foothold Line Connector Launcher</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f6f7f9;
        color: #1d2430;
        font-family: "Segoe UI", Arial, sans-serif;
      }
      main {
        width: min(680px, calc(100vw - 32px));
        border: 1px solid #d8dde5;
        border-radius: 8px;
        background: white;
        padding: 24px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 22px;
      }
      p {
        margin: 8px 0;
        line-height: 1.55;
      }
      code {
        background: #eef1f5;
        padding: 2px 5px;
        border-radius: 4px;
      }
      a {
        color: #0f6f62;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Foothold Line Connector</h1>
      <p id="status">로컬 서버 확인 중...</p>
      <p>
        브라우저 보안 정책 때문에 HTML 파일만으로 Node 서버나 MakerMCP를 직접 실행할 수 없습니다.
      </p>
      <p>
        서버가 자동으로 열리지 않으면 이 폴더의
        <code>Start Foothold Line Connector.cmd</code>를 더블클릭하세요.
      </p>
      <p>
        서버가 이미 실행 중이면 <a href="http://localhost:3147/">http://localhost:3147/</a>로 이동합니다.
      </p>
    </main>
    <script>
      const status = document.querySelector("#status");
      fetch("http://localhost:3147/api/status", { cache: "no-store" })
        .then((response) => {
          if (!response.ok) throw new Error("server not ready");
          status.textContent = "서버가 실행 중입니다. GUI로 이동합니다.";
          location.href = "http://localhost:3147/";
        })
        .catch(() => {
          status.textContent = "서버가 꺼져 있습니다. cmd 런처를 더블클릭하세요.";
        });
    </script>
  </body>
</html>
