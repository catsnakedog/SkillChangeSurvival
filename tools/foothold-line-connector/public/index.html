<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MSW Foothold Line Connector</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div>
          <h1>Foothold Line Connector</h1>
          <p>World/maps/{Map}/EditorGeneratedGrid/{Room}/{*_line}</p>
        </div>
        <div id="statusBadge" class="status status-warn">MCP 확인 중</div>
      </header>

      <section class="controls">
        <label>
          <span>맵</span>
          <select id="mapSelect"></select>
        </label>
        <label>
          <span>Room</span>
          <select id="roomSelect"></select>
        </label>
        <label>
          <span>Line parent</span>
          <select id="lineSelect"></select>
        </label>
        <div class="count">
          <span>Foothold</span>
          <strong id="footholdCount">0</strong>
        </div>
      </section>

      <section class="actions">
        <button id="refreshButton" type="button">목록 새로고침</button>
        <button id="saveButton" type="button">현재 맵 저장</button>
        <button id="dryRunButton" type="button">Dry Run</button>
        <button id="connectButton" type="button" class="primary">Edge 자동 연결 실행</button>
      </section>

      <section class="logPanel">
        <div class="logTitle">로그</div>
        <pre id="log"></pre>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
